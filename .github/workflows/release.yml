name: Release

# Every push to main: when no tag exists for the current AssemblyVersion, run fork/release.sh with
# the merged PR's "## Release notes" section as the changelog. Merges without a version bump stop
# at the tag check, and so does the manifest commit release.sh pushes.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for an unreleased version
        id: check
        run: |
          version=$(sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' Directory.Build.props)
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "v$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v5
        if: steps.check.outputs.release == 'true'
        with:
          dotnet-version: '9.0.x'

      - name: Release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git log -1 --format=%s)
          pr=$(echo "$subject" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
          notes=""
          if [ -n "$pr" ]; then
            notes=$(gh pr view "$pr" --json body -q .body | python3 -c '
          import re, sys
          m = re.search(r"^## Release notes\s*\n(.*?)(?=^## |\Z)", sys.stdin.read(), re.S | re.M)
          notes = re.sub(r"<!--.*?-->", "", m.group(1), flags=re.S) if m else ""
          print(re.sub(r"^.*Generated with \[Claude Code\].*$", "", notes, flags=re.M).strip())')
          fi
          [ -n "$notes" ] || notes="$subject"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fork/release.sh "$notes"
