name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: SDK version matches targetAbi.txt
        # Issue #63: the Jellyfin SDK we compile against is the minimum Jellyfin a release loads on.
        run: |
          abi=$(cat targetAbi.txt)
          sdk=$(grep -oP 'Include="Jellyfin.Controller" Version="\K[^"]+' LetterboxdSync/LetterboxdSync.csproj)
          [ "${abi%.0}" = "$sdk" ] || [ "$abi" = "$sdk" ] || { echo "::error::Jellyfin.Controller $sdk != targetAbi.txt $abi"; exit 1; }

      - run: dotnet test -c Release --filter "Category!=Integration"

  jellyfin-12-probe:
    # Informational only: does the code still build and pass against the Jellyfin 12 SDK (net10.0)?
    # Shipping builds stay on net9.0 / the 10.11 SDK; see CLAUDE.md, "Jellyfin 12 cliff".
    name: Jellyfin 12 probe (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build and test against Jellyfin 12
        run: |
          set -euo pipefail
          PLUGIN=LetterboxdSync/LetterboxdSync.csproj
          TESTS=LetterboxdSync.Tests/LetterboxdSync.Tests.csproj
          sed -i 's|<TargetFramework>net9.0</TargetFramework>|<TargetFramework>net10.0</TargetFramework>|' "$PLUGIN" "$TESTS"
          sed -i 's|Include="Jellyfin.Controller" Version="[^"]*"|Include="Jellyfin.Controller" Version="12.1.0"|' "$PLUGIN"
          sed -i 's|Include="Jellyfin.Model" Version="[^"]*"|Include="Jellyfin.Model" Version="12.1.0"|' "$PLUGIN"
          sed -i 's|Include="Microsoft.AspNetCore.DataProtection" Version="[^"]*"|Include="Microsoft.AspNetCore.DataProtection" Version="10.0.12"|' "$PLUGIN"
          sed -i 's|Include="Microsoft.Extensions.DependencyInjection" Version="[^"]*"|Include="Microsoft.Extensions.DependencyInjection" Version="10.0.12"|' "$TESTS"
          sed -i 's|Include="Microsoft.Extensions.Hosting.Abstractions" Version="[^"]*"|Include="Microsoft.Extensions.Hosting.Abstractions" Version="10.0.12"|' "$TESTS"
          grep -qF 'Jellyfin.Controller" Version="12.1.0"' "$PLUGIN"
          dotnet test -c Release --filter "Category!=Integration"
